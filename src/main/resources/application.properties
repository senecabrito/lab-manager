spring.application.name=lab-manager

lab-manager.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

lab-manager.scheduling.zone-id=${LAB_MANAGER_TIME_ZONE:America/Sao_Paulo}
lab-manager.scheduling.opening-time=${LAB_MANAGER_OPENING_TIME:07:30}
lab-manager.scheduling.closing-time=${LAB_MANAGER_CLOSING_TIME:18:00}
lab-manager.scheduling.slot-minutes=${LAB_MANAGER_SLOT_MINUTES:30}
lab-manager.scheduling.minimum-advance-hours=${LAB_MANAGER_MINIMUM_ADVANCE_HOURS:72}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

jwt.expiration=${JWT_EXPIRATION:900000}
jwt.key=${JWT_KEY}
